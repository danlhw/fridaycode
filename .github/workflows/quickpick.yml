name: QuickPick

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "quickpick/**"
      - ".github/workflows/quickpick.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build QuickPick.exe
        working-directory: quickpick
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller --onefile --noconsole --name QuickPick quickpick.py
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quickpick
          name: QuickPick
          body: "Download QuickPick.exe, double-click, paste your API key once. Press F6 over a question. Quit from the tray icon."
          files: quickpick/dist/QuickPick.exe
          make_latest: false
