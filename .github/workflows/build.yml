name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inject API key
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTRHOPIC_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:ANTHROPIC_API_KEY)) {
            Write-Error "Repository secret ANTRHOPIC_API_KEY is not set."
            exit 1
          }
          $content = Get-Content -Raw Program.cs
          $content = $content.Replace('__ANTHROPIC_API_KEY__', $env:ANTHROPIC_API_KEY)
          Set-Content -NoNewline -Path Program.cs -Value $content

      - name: Publish single-file self-contained EXE
        run: dotnet publish SchoolApp.csproj -c Release -r win-x64 -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-windows-exe
          path: publish/school.exe
          retention-days: 30

      - name: Attach to Release (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: publish/school.exe
